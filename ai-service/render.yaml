services:
  - type: web
    name: circlo-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python train_price_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
